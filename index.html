<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>ADAS Bike Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">ESP32-C3 · LD2451 · BLE GATT</div>
    <h1>ADAS Bike Monitor</h1>
  </div>
  <div class="actions">
    <button id="connect" class="primary">Kết nối BLE</button>
    <button id="disconnect" disabled>Ngắt</button>
  </div>
</header>

<main>
  <section class="grid">
    <article class="card">
      <div class="card-title">Radar / Risk</div>
      <div class="status-line">
        <span id="bleDot" class="dot off"></span>
        <strong id="bleState">Chưa kết nối</strong>
      </div>
      <div class="metrics">
        <div><span>Risk</span><b id="risk">—</b></div>
        <div><span>Targets</span><b id="targets">—</b></div>
        <div><span>Distance</span><b id="distance">—</b></div>
        <div><span>Closing</span><b id="closing">—</b></div>
        <div><span>Angle</span><b id="angle">—</b></div>
        <div><span>SNR</span><b id="snr">—</b></div>
        <div><span>TTC</span><b id="ttc">—</b></div>
      </div>
    </article>

    <article class="card">
      <div class="card-title">GPS</div>
      <div class="metrics">
        <div><span>Fix</span><b id="fix">—</b></div>
        <div><span>Sats</span><b id="sats">—</b></div>
        <div><span>Speed</span><b id="speed">—</b></div>
        <div class="wide"><span>Coords</span><b id="coords">—</b></div>
      </div>
    </article>

    <article class="card config-card">
      <div class="card-title">LD2451 Config</div>

      <label>Tầm phát hiện / cảnh báo (m)
        <input id="range" type="number" min="10" max="100" step="1" value="100">
      </label>

      <label>Hướng mục tiêu
        <select id="direction">
          <option value="0">Away only</option>
          <option value="1" selected>Approach only</option>
          <option value="2">Both</option>
        </select>
      </label>

      <label>Tốc độ tối thiểu (km/h)
        <input id="minSpeed" type="number" min="0" max="120" step="1" value="5">
      </label>

      <label>Delay khi mất target (s)
        <input id="delayS" type="number" min="0" max="255" step="1" value="2">
      </label>

      <label>Trigger count
        <input id="triggerCount" type="number" min="1" max="10" step="1" value="1">
      </label>

      <label>SNR threshold
        <select id="snrThreshold">
          <option value="0">0 - Default firmware</option>
          <option value="3">3 - Nhạy hơn</option>
          <option value="4" selected>4 - Mặc định</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8 - Ít nhạy hơn</option>
        </select>
      </label>

      <div class="split">
        <label>TTC warn (s)
          <input id="warn" type="number" min="0.5" max="30" step="0.1" value="5.0">
        </label>
        <label>TTC critical (s)
          <input id="critical" type="number" min="0.2" max="15" step="0.1" value="2.5">
        </label>
      </div>

      <div class="button-row">
        <button id="readcfg" disabled>Đọc từ radar</button>
        <button id="writecfg" class="primary" disabled>Gửi cấu hình</button>
      </div>
      <div class="button-row">
        <button id="fw" disabled>Đọc firmware</button>
        <button id="ping" disabled>PING</button>
      </div>
      <p class="hint">TTC là ngưỡng của ứng dụng ADAS, không phải tham số nội bộ LD2451.</p>
    </article>

    <article class="card">
      <div class="card-title">Log hành trình</div>
      <div class="button-row">
        <button id="start">Start log</button>
        <button id="stop" disabled>Stop</button>
        <button id="clear">Clear</button>
      </div>
      <div class="button-row">
        <button id="export">Export GeoJSON</button>
        <button id="center">Về vị trí hiện tại</button>
      </div>
      <p id="tripInfo" class="hint">0 điểm</p>
    </article>
  </section>

  <section class="card map-card">
    <div class="card-title">Bản đồ hành trình</div>
    <div id="map"></div>
  </section>

  <section class="card">
    <div class="card-title">Console</div>
    <pre id="log"></pre>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
